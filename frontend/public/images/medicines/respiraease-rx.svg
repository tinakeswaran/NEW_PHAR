<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141e30" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e8eef5" />
    </linearGradient>
    <linearGradient id="rxBand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c62828" />
      <stop offset="100%" stop-color="#e53935" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="32" fill="url(#bgGrad)" />
  <circle cx="200" cy="210" r="140" fill="#1e88e5" opacity="0.1" />

  <g filter="url(#shadow)">
    <!-- Medicine Box -->
    <rect x="90" y="110" width="220" height="190" rx="16" fill="url(#boxGrad)" stroke="#bdc3c7" stroke-width="1" />
    
    <!-- Red Rx Header Stripe -->
    <rect x="90" y="110" width="220" height="38" rx="16" fill="url(#rxBand)" />
    <rect x="90" y="132" width="220" height="16" fill="url(#rxBand)" />
    
    <!-- Rx Badge & Text -->
    <text x="115" y="136" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="900" fill="#ffffff">Rx</text>
    <text x="145" y="134" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff" letter-spacing="1">PRESCRIPTION ONLY</text>
    
    <!-- Brand -->
    <text x="115" y="172" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="800" fill="#1565c0" letter-spacing="0.5">AIRWELL PHARMA</text>
    
    <!-- Medicine Title -->
    <text x="115" y="202" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="900" fill="#0d47a1">RespiraEase Rx</text>
    <text x="115" y="222" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#37474f">Bronchodilator Formulation</text>
    <text x="115" y="240" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="500" fill="#78909c">Active Formulation 200mg</text>
    
    <!-- Box Footer Line & Details -->
    <line x1="115" y1="262" x2="285" y2="262" stroke="#cfd8dc" stroke-width="1" />
    <text x="115" y="282" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="800" fill="#141e30">20 CLINICAL CAPSULES</text>
  </g>

  <!-- Blister Pack Overlay -->
  <g opacity="0.9" transform="translate(230, 220) rotate(-15)">
    <rect x="0" y="0" width="110" height="70" rx="8" fill="#d6e0ea" stroke="#90a4ae" stroke-width="1.5" />
    <!-- Blister bubbles -->
    <rect x="12" y="12" width="22" height="18" rx="9" fill="#1565c0" opacity="0.8" />
    <rect x="44" y="12" width="22" height="18" rx="9" fill="#1565c0" opacity="0.8" />
    <rect x="76" y="12" width="22" height="18" rx="9" fill="#1565c0" opacity="0.8" />
    <rect x="12" y="40" width="22" height="18" rx="9" fill="#1565c0" opacity="0.8" />
    <rect x="44" y="40" width="22" height="18" rx="9" fill="#1565c0" opacity="0.8" />
    <rect x="76" y="40" width="22" height="18" rx="9" fill="#1565c0" opacity="0.8" />
  </g>
</svg>
