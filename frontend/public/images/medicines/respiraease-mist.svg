<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09252c" />
      <stop offset="100%" stop-color="#030f13" />
    </linearGradient>
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0e6b7c" />
      <stop offset="30%" stop-color="#199bb3" />
      <stop offset="70%" stop-color="#0e6b7c" />
      <stop offset="100%" stop-color="#084753" />
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f7fa" />
      <stop offset="100%" stop-color="#b2ebf2" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="32" fill="url(#bgGrad)" />
  <circle cx="200" cy="210" r="140" fill="#199bb3" opacity="0.12" />

  <!-- Spray Mist droplets effect -->
  <g opacity="0.7">
    <circle cx="200" cy="50" r="4" fill="#b2ebf2" />
    <circle cx="185" cy="40" r="3" fill="#80deea" />
    <circle cx="215" cy="42" r="2.5" fill="#80deea" />
    <circle cx="170" cy="30" r="2" fill="#e0f7fa" opacity="0.5" />
    <circle cx="230" cy="32" r="2" fill="#e0f7fa" opacity="0.5" />
    <path d="M190 60 Q200 45 210 60" stroke="#b2ebf2" stroke-width="2" fill="none" opacity="0.6" />
  </g>

  <g filter="url(#shadow)">
    <!-- Spray Nozzle Tip -->
    <path d="M190 70 L210 70 L206 95 L194 95 Z" fill="url(#capGrad)" />
    <!-- Spray Finger Wings -->
    <rect x="160" y="95" width="80" height="16" rx="4" fill="url(#capGrad)" />
    <!-- Collar -->
    <rect x="175" y="111" width="50" height="24" fill="#084753" />

    <!-- Bottle Body -->
    <rect x="135" y="135" width="130" height="195" rx="20" fill="url(#bottleGrad)" />
    
    <!-- Label -->
    <rect x="141" y="165" width="118" height="145" rx="10" fill="#ffffff" />
    
    <!-- Brand Header -->
    <rect x="141" y="165" width="118" height="34" rx="10" fill="#09252c" />
    <text x="200" y="187" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="900" fill="#26c6da" text-anchor="middle" letter-spacing="1">AIRWELL</text>
    
    <!-- Title -->
    <text x="200" y="218" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="900" fill="#09252c" text-anchor="middle">RespiraEase</text>
    <text x="200" y="234" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="800" fill="#00838f" text-anchor="middle">MIST SPRAY</text>
    <text x="200" y="252" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="600" fill="#546e7a" text-anchor="middle">Isotonic Saline Blend</text>
    
    <!-- Wave Graphic -->
    <path d="M165 270 Q182.5 260 200 270 T235 270" stroke="#00acc1" stroke-width="3" fill="none" stroke-linecap="round" />
    
    <!-- Footer -->
    <text x="200" y="296" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="800" fill="#09252c" text-anchor="middle">100 ML NASAL SPRAY</text>
  </g>
</svg>
