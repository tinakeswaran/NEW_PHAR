<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c202d" />
      <stop offset="100%" stop-color="#030a0f" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006699" />
      <stop offset="100%" stop-color="#003355" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="32" fill="url(#bgGrad)" />
  <circle cx="200" cy="210" r="140" fill="#0088cc" opacity="0.15" />

  <g filter="url(#shadow)">
    <!-- Box -->
    <rect x="110" y="90" width="180" height="210" rx="18" fill="url(#boxGrad)" />
    
    <!-- White Face -->
    <rect x="120" y="120" width="160" height="165" rx="12" fill="#ffffff" />
    
    <!-- Header Banner -->
    <rect x="120" y="120" width="160" height="38" rx="12" fill="#0c202d" />
    <text x="200" y="144" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="900" fill="#66ccff" text-anchor="middle" letter-spacing="1">HYDRACARE</text>
    
    <!-- Title -->
    <text x="200" y="180" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="19" font-weight="900" fill="#003355" text-anchor="middle">HydraCare</text>
    <text x="200" y="198" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="800" fill="#006699" text-anchor="middle">MINERAL COMPLEX</text>
    <text x="200" y="216" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="600" fill="#0088cc" text-anchor="middle">TRACE MINERAL SACHETS</text>
    
    <!-- Crystal Emblem -->
    <polygon points="200,230 212,244 200,260 188,244" fill="#0088cc" stroke="#00aaff" stroke-width="1.5" />
    
    <!-- Footer -->
    <text x="200" y="274" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="800" fill="#0c202d" text-anchor="middle">20 INDIVIDUAL SACHETS</text>
  </g>
</svg>
