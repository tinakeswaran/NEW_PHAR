<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#072233" />
      <stop offset="100%" stop-color="#020d14" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0288d1" />
      <stop offset="100%" stop-color="#01579b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="32" fill="url(#bgGrad)" />
  <circle cx="200" cy="210" r="140" fill="#03a9f4" opacity="0.15" />

  <g filter="url(#shadow)">
    <!-- Box -->
    <rect x="110" y="90" width="180" height="210" rx="18" fill="url(#boxGrad)" />
    
    <!-- White Face -->
    <rect x="120" y="120" width="160" height="165" rx="12" fill="#ffffff" />
    
    <!-- Header Banner -->
    <rect x="120" y="120" width="160" height="38" rx="12" fill="#072233" />
    <text x="200" y="144" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="900" fill="#81d4fa" text-anchor="middle" letter-spacing="1">FORGEWELL</text>
    
    <!-- Title -->
    <text x="200" y="180" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="900" fill="#01579b" text-anchor="middle">Hydration</text>
    <text x="200" y="198" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="800" fill="#0288d1" text-anchor="middle">ELECTROLYTE RECOVERY</text>
    <text x="200" y="216" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="600" fill="#4fc3f7" text-anchor="middle">RAPID HYDRATION BLEND</text>
    
    <!-- Water Drop Emblem -->
    <path d="M200 230 C200 230 190 242 190 248 C190 253.5 194.5 258 200 258 C205.5 258 210 253.5 210 248 C210 242 200 230 200 230 Z" fill="#0288d1" />
    
    <!-- Footer -->
    <text x="200" y="274" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="800" fill="#072233" text-anchor="middle">12 FAST-ACTING SACHETS</text>
  </g>
</svg>
